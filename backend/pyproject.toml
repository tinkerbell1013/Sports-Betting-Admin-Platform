[tool.poetry]
name = "sports-betting-admin"
version = "0.1.0"
description = "Admin API for sports betting platform"
authors = ["Oliver"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.25"
